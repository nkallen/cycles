name: Plasticity Cycles

on:
  push:
    branches: [codex/cycles-shared-library]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            library: libplasticity_cycles.dylib
            parallel: 3
            update: make update
          - os: windows-latest
            library: plasticity_cycles.dll
            parallel: 1
            update: cmd /c make.bat update
          - os: ubuntu-latest
            library: libplasticity_cycles.so
            parallel: 4
            update: make update
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute dependency cache key
        id: libraries
        shell: bash
        run: echo "revision=$(git rev-parse HEAD:lib)" >> "$GITHUB_OUTPUT"
      - name: Cache Cycles dependencies
        uses: actions/cache@v4
        with:
          path: .git/modules/lib
          key: cycles-libraries-${{ runner.os }}-${{ runner.arch }}-${{ steps.libraries.outputs.revision }}
      - name: Download Cycles dependencies
        run: ${{ matrix.update }}
      - name: Select Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo CC=gcc-14 >> "$GITHUB_ENV"
          echo CXX=g++-14 >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" -DWITH_CYCLES_HYDRA_RENDER_DELEGATE=OFF -DWITH_PLASTICITY_CYCLES=ON
      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}
      - name: Install
        run: cmake --install build --config Release
      - name: Verify shared library and render
        run: python tools/test_plasticity_cycles.py "install/${{ matrix.library }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plasticity-cycles-${{ runner.os }}-${{ runner.arch }}
          path: |
            install/
            !install/cycles
            !install/cycles.exe
          if-no-files-found: error
